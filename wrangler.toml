# The service. One Worker, one database, and the registry served as static assets
# so `shadcn add https://…/r/places-picker.json` resolves without a second host.
name = "shadcn-places"
main = "src/index.ts"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]

# Everything served as a file lives in public/ and nowhere else. It held the demo
# and the registry item as copies of demo/ and registry/ for a while, which meant
# editing the demo changed nothing until somebody remembered to copy it — a step
# that exists only to be forgotten. registry/ stays as the authoring location for
# the item's canonical form; public/ is what is served.
[assets]
directory = "public"
binding = "REGISTRY"

[[d1_databases]]
binding = "DB"
database_name = "places"
# Filled by `wrangler d1 create places`. Left empty rather than faked, because a
# wrong id fails at deploy time with a confusing error instead of at setup time
# with an obvious one.
database_id = "da9ec12f-c128-45c9-9fbd-cf3a534f85ca"

# The names refresh, weekly.
#
# A Workflow rather than a cron handler because it will fail partway — Wikidata
# rate-limits and batches time out, both of which happened while building it. A
# step retries on its own and the instance resumes, so a stumble at batch 200 of
# 279 does not re-fetch the first 199.
[[workflows]]
name = "refresh-names"
binding = "REFRESH"
class_name = "RefreshNames"

# Sunday, early. Nothing about this is urgent and the endpoints it leans on are
# other people's volunteer infrastructure — off-peak is simple politeness.
[triggers]
crons = ["17 3 * * SUN"]

# Where each run's report is kept. The interesting question is asked weeks later —
# "when did Thai coverage jump, and what did it" — and logs are gone by then.
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "shadcn-places-archive"

[observability]
enabled = true

# Cities are 152,970 rows and the picker queries on every keystroke, so the
# refresh job is the only thing here that needs a long CPU budget. The default
# 30s is right for serving.
[limits]
cpu_ms = 30000

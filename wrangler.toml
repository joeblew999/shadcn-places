# The service. One Worker, one database, and the registry served as static assets
# so `shadcn add https://…/r/places-picker.json` resolves without a second host.
name = "shadcn-places"
main = "src/index.ts"
compatibility_date = "2026-09-10"
# `enable_request_signal` makes `request.signal` fire when the client goes away.
# The picker debounces and then aborts in-flight searches as somebody keeps
# typing; without this the Worker carries on running a D1 query nobody is waiting
# for and D1 bills the rows it scans. Every abandoned keystroke was being paid for.
#
# `unhandled_rejection_after_microtask_checkpoint` makes an unhandled rejection
# surface as an error rather than being swallowed — this service has already had
# two failures that reported success, and that is enough.
compatibility_flags = [
  "nodejs_compat",
  "enable_request_signal",
  "unhandled_rejection_after_microtask_checkpoint",
]

# Everything served as a file lives in public/ and nowhere else. It held the demo
# and the registry item as copies of demo/ and registry/ for a while, which meant
# editing the demo changed nothing until somebody remembered to copy it — a step
# that exists only to be forgotten. registry/ stays as the authoring location for
# the item's canonical form; public/ is what is served.
[assets]
directory = "public"
binding = "REGISTRY"

[[d1_databases]]
binding = "DB"
database_name = "places"
# Filled by `wrangler d1 create places`. Left empty rather than faked, because a
# wrong id fails at deploy time with a confusing error instead of at setup time
# with an obvious one.
database_id = "da9ec12f-c128-45c9-9fbd-cf3a534f85ca"

# The names refresh, weekly.
#
# A Workflow rather than a cron handler because it will fail partway — Wikidata
# rate-limits and batches time out, both of which happened while building it. A
# step retries on its own and the instance resumes, so a stumble at batch 200 of
# 279 does not re-fetch the first 199.
[[workflows]]
name = "refresh-names"
binding = "REFRESH"
class_name = "RefreshNames"

# The ETL's top half. Not on a schedule: it runs when a *source* releases, which
# is a decision rather than a rhythm — and it is the expensive one.
[[workflows]]
name = "stage-sources"
binding = "STAGE"
class_name = "StageSources"

# Merge, load and import. Partitioned by place id so each step holds a tenth of
# the data — 128MB per isolate is the whole design constraint here.
#
# Not on a schedule either: importing blocks the database while it runs, so it is
# a deliberate act rather than a rhythm.
[[workflows]]
name = "build-database"
binding = "BUILD"
class_name = "BuildDatabase"

# Sunday, early. Nothing about this is urgent and the endpoints it leans on are
# other people's volunteer infrastructure — off-peak is simple politeness.
[triggers]
crons = ["17 3 * * SUN"]

# Where each run's report is kept. The interesting question is asked weeks later —
# "when did Thai coverage jump, and what did it" — and logs are gone by then.
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "shadcn-places-archive"

[observability]
enabled = true

# Invocation logs, which are off by default and are the ones that matter here.
#
# Without them a Workflow step that is killed at the CPU limit leaves nothing
# queryable: `wrangler tail` shows live *requests* and returned zero lines for a
# stalled Workflow, and the dashboard summary said "2 requests killed at 30
# seconds of CPU" with no way to ask which step. That summary is how the CPU wall
# was found at all, and it took a human reading a dashboard.
#
# With these on, the same failure is a query — outcome, CPU time and the step that
# spent it — against the Workers Observability API.
[observability.logs]
invocation_logs = true

# Per-procedure spans, through the Workers custom-spans API rather than an
# OpenTelemetry SDK.
#
# This service has had no observability at all. Every failure so far was found by
# a person watching a page: a 500 on every subdivision request, a 431 from
# Wikidata, a spec generator throwing inside a route. None of them appeared
# anywhere because nothing was recording.
[observability.traces]
enabled = true

# Five minutes, up from the 30-second default — and there was already a [limits]
# table here saying the opposite, which is how the second one got written.
#
# The old comment read: "the refresh job is the only thing here that needs a long
# CPU budget. The default 30s is right for serving." Both halves are now wrong.
# The ETL runs here too, and the merge's partitions were killed at exactly that
# 30-second wall — surfacing as "2 requests killed at 30 seconds of CPU" in a
# dashboard rather than as a failing step.
#
# This is headroom, not the fix. The fix was making each merge partition read a
# tenth of the input instead of all of it. Raising the ceiling on a design that
# wasted 10x would only have moved the wall.
#
# Costs nothing when unused: CPU is billed on what is consumed, not on what is
# allowed. 30 million ms are included per month and a full ETL run spends a few
# hundred thousand.
[limits]
cpu_ms = 300000

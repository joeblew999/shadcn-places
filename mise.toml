# The toolchain, pinned, so that "works on my machine" is a claim about a version
# rather than about a machine. Same versions as the repository this grew out of,
# because a contributor moving between the two should not be switching runtimes.
[tools]
bun  = "1.4.0"
# tsc runs on node even though everything else runs on bun. Without this pinned,
# `bun run typecheck` fails with "No version is set for shim: node" on a machine
# that has mise but no global default — which is most of them.
node = "26.8.1"
